[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-warehouse"
version = "0.1.0"
description = "A small multi-robot warehouse: a PettingZoo ParallelEnv with a Pygame renderer."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "gymnasium",
    "pettingzoo",
    "pygame",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "pillow"]
rl = ["stable-baselines3", "supersuit", "torch"]

[tool.setuptools.packages.find]
include = ["mini_warehouse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
